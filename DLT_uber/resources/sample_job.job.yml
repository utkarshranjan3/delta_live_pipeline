# A sample job for DLT_uber.

resources:
  jobs:
    sample_job:
      name: uber_job_new

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: run_uber_dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.DLT_uber_etl.id}
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            