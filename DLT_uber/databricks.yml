# This is a Declarative Automation Bundle definition for DLT_uber.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DLT_uber
  uuid: 698fb21d-64b1-4c7e-a9d6-ebbb568653ed

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d78f1eb4-1600.cloud.databricks.com
    variables:
      catalog: main
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-d78f1eb4-1600.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/utkarshranjan3@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/utkarshranjan3@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: default
    permissions:
      - user_name: utkarshranjan3@gmail.com
        level: CAN_MANAGE
